name: Evidence update
description: Submit a guideline, paper, review, or evidence change for consideration.
title: "[Evidence] "
labels: ["evidence", "needs-review"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. Please do not include identifiable patient information or private medical records.
  - type: input
    id: topic
    attributes:
      label: Topic
      placeholder: e.g. ACL rehabilitation, acute meniscus diagnosis
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: DOI, PMID, guideline URL, or source URL
      placeholder: https://...
    validations:
      required: true
  - type: textarea
    id: relevance
    attributes:
      label: Why is this source relevant?
      description: What existing question, claim, or knowledge page might it affect?
    validations:
      required: true
  - type: textarea
    id: limitations
    attributes:
      label: Known scope or limitations
      description: Population, exclusions, study limits, conflicts, or applicability concerns you noticed.
  - type: textarea
    id: coi
    attributes:
      label: Relevant conflict of interest
      description: Disclose relevant financial/professional/product/clinic/treatment interests, or write None known.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Public issue acknowledgement
      options:
        - label: I have not included identifiable patient health information, private records, or raw medical images.
          required: true
